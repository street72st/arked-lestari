<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arked Lestari - Cafe Finder</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>&#9749;</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0f14;
      --surface: #161a22;
      --surface-2: #12151c;
      --border: #232935;
      --border-hi: #2f3646;
      --amber: #f0a04b;
      --amber-dim: #b98543;
      --open: #4ade80;
      --closed: #94a3b8;
      --text: #f4f4f5;
      --text-2: #9ca3af;
      --text-3: #6b7280;
      --text-4: #4b5563;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      max-width: 640px; margin: 0 auto;
    }

    @keyframes breathe { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.55; transform:scale(.82);} }
    @keyframes ring { 0%{transform:scale(1); opacity:.6;} 100%{transform:scale(2.6); opacity:0;} }
    @keyframes fadeup { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
    @media (prefers-reduced-motion: reduce) {
      .dot.on, .dot.on::after, .card { animation: none !important; }
    }

    .header {
      padding: 30px 20px 22px;
      background: linear-gradient(180deg, var(--surface-2) 0%, var(--bg) 100%);
      border-bottom: 1px solid #1c212b;
    }
    .brand {
      display: flex; align-items: center; gap: 9px; margin-bottom: 5px;
    }
    .brand-mark { font-size: 22px; }
    .brand-name {
      font-size: 12px; font-weight: 600; letter-spacing: .18em;
      text-transform: uppercase; color: var(--amber);
    }
    .header h1 {
      font-size: 26px; font-weight: 700; letter-spacing: -.02em;
      margin-bottom: 5px; line-height: 1.15;
    }
    .header .sub { font-size: 13px; color: var(--text-3); }
    .header .live {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-3); margin-top: 3px;
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--open);
      animation: breathe 2.4s ease-in-out infinite;
    }
    .admin-link {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 16px;
      background: rgba(240,160,75,.1); color: var(--amber); text-decoration: none;
      padding: 9px 16px; border-radius: 22px; font-size: 12px; font-weight: 600;
      border: 1px solid rgba(240,160,75,.25); transition: all .2s;
    }
    .admin-link:active { background: rgba(240,160,75,.2); }

    .filters { display: flex; gap: 8px; padding: 16px 16px 4px; }
    .filter-btn {
      flex: 1; background: var(--surface); color: var(--text-2);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s;
      font-family: inherit;
    }
    .filter-btn.active {
      background: var(--amber); color: #1a1205; border-color: var(--amber); font-weight: 600;
    }

    .grid { padding: 12px 16px 28px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 16px 14px; margin-bottom: 12px;
      animation: fadeup .35s ease both;
    }
    .card.is-open { border-color: #2a3320; }

    .card-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 12px; gap: 12px;
    }
    .cafe-name { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
    .cafe-loc {
      font-size: 12px; color: var(--text-3);
      display: flex; align-items: center; gap: 5px;
    }
    .cafe-loc .ic { opacity: .7; }

    .pill {
      font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 11px 5px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .pill.on { background: rgba(74,222,128,.12); color: var(--open); }
    .pill.off { background: rgba(148,163,184,.12); color: var(--closed); }
    .dot { width: 9px; height: 9px; border-radius: 50%; position: relative; }
    .dot.on { background: var(--open); animation: breathe 2.4s ease-in-out infinite; }
    .dot.on::after {
      content:''; position:absolute; inset:0; border-radius:50%;
      background: var(--open); animation: ring 2.4s ease-out infinite;
    }
    .dot.off { background: var(--closed); }

    .hours {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-2); margin-bottom: 12px;
    }
    .hours .ic { opacity: .6; }

    .special {
      background: linear-gradient(135deg, #2a2010, #1f180b);
      border: 1px solid #3d2f14; border-radius: 10px; padding: 11px 13px;
    }
    .special-label {
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--amber); margin-bottom: 4px;
    }
    .special-text { font-size: 13px; color: #e8d5b5; line-height: 1.5; }
    .no-special {
      font-size: 12px; font-style: italic; color: #5b6472; padding: 6px 0 2px;
    }
    .updated {
      font-size: 10px; color: var(--text-4); text-align: right; margin-top: 9px;
    }
    .loading { text-align: center; padding: 3rem; color: var(--text-3); font-size: 14px; }
    .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-3); font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-mark">&#9749;</span>
      <span class="brand-name">Arked Lestari</span>
    </div>
    <h1>What's open right now</h1>
    <div class="sub">6 cafes &middot; UTM campus</div>
    <div class="live"><span class="live-dot"></span><span id="liveStatus">Connecting&hellip;</span></div>
    <br>
    <a href="admin.html" class="admin-link">&#128100; Cafe owner? Admin panel &rarr;</a>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterCafes('all', event)">All</button>
    <button class="filter-btn" onclick="filterCafes('open', event)">Open now</button>
    <button class="filter-btn" onclick="filterCafes('special', event)">Specials</button>
  </div>

  <div class="grid" id="cafeGrid">
    <div class="loading">Loading cafes&hellip;</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ===== Firebase config (same project as your admin panel) =====
    const firebaseConfig = {
      apiKey: "AIzaSyBYMXrWKpAh1deuuhUdUM8t31zJnMjAFrY",
      authDomain: "makan-utm.firebaseapp.com",
      projectId: "makan-utm",
      storageBucket: "makan-utm.firebasestorage.app",
      messagingSenderId: "243510334532",
      appId: "1:243510334532:web:c829ba0da63ebad3ea1811"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const CAFES = ['Cafe EastCoast', 'Cafe Lanita', 'Cafe Navy Blue', 'Cafe Western', 'Cafe Ajimory', 'Cafe PakLah'];

    let liveData = {};
    let currentFilter = 'all';

    // ===== Real-time read from Firestore =====
    db.collection('cafes').onSnapshot((snapshot) => {
      liveData = {};
      snapshot.forEach(doc => { liveData[doc.id] = doc.data(); });
      document.getElementById('liveStatus').textContent =
        'Live \u00b7 updated ' + new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
      render();
    }, (error) => {
      console.error('Firestore read error:', error);
      document.getElementById('liveStatus').textContent = 'Offline \u2014 check connection';
    });

    // Friendly "Updated: 24 Aug 2026, 11:45 AM" or "Not updated yet"
    function formatUpdated(ts) {
      if (!ts || typeof ts.toDate !== 'function') return 'Not updated yet';
      const d = ts.toDate();
      const date = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      return 'Updated ' + date + ', ' + time;
    }

    function render() {
      const grid = document.getElementById('cafeGrid');
      grid.innerHTML = CAFES.map((cafeName, i) => {
        const data = liveData[cafeName] || {};
        const status   = data.status   || 'open';
        const hours    = data.hours    || '7:00 AM - 10:00 PM';
        const location = data.location || '';
        const special  = data.special  || '';
        const updated  = formatUpdated(data.updatedAt);

        const hasSpecial = special.trim().length > 0;
        const isOpen = status === 'open';

        return `
          <div class="card ${isOpen ? 'is-open' : ''}" data-status="${status}" data-has-special="${hasSpecial}" style="animation-delay:${i*40}ms">
            <div class="card-top">
              <div>
                <div class="cafe-name">${cafeName}</div>
                <div class="cafe-loc"><span class="ic">&#128205;</span>${location || 'Location not set'}</div>
              </div>
              <span class="pill ${isOpen ? 'on' : 'off'}">
                <span class="dot ${isOpen ? 'on' : 'off'}"></span>${isOpen ? 'Open' : 'Closed'}
              </span>
            </div>
            <div class="hours"><span class="ic">&#128337;</span>${hours}</div>
            ${hasSpecial
              ? `<div class="special"><div class="special-label">Today's special</div><div class="special-text">${special}</div></div>`
              : `<div class="no-special">No specials today</div>`}
            <div class="updated">${updated}</div>
          </div>
        `;
      }).join('');
      applyFilter();
    }

    function applyFilter() {
      let shown = 0;
      document.querySelectorAll('.card').forEach(card => {
        const status = card.dataset.status;
        const hasSpecial = card.dataset.hasSpecial === 'true';
        let show = true;
        if (currentFilter === 'open') show = status === 'open';
        else if (currentFilter === 'special') show = hasSpecial;
        card.style.display = show ? 'block' : 'none';
        if (show) shown++;
      });
      // Empty-state message
      const grid = document.getElementById('cafeGrid');
      let emptyEl = document.getElementById('emptyMsg');
      if (shown === 0) {
        if (!emptyEl) {
          emptyEl = document.createElement('div');
          emptyEl.id = 'emptyMsg';
          emptyEl.className = 'empty';
          grid.appendChild(emptyEl);
        }
        emptyEl.textContent = currentFilter === 'open'
          ? 'No cafes are open right now.'
          : 'No cafes have specials today.';
      } else if (emptyEl) {
        emptyEl.remove();
      }
    }

    function filterCafes(type, ev) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (ev && ev.target) ev.target.classList.add('active');
      applyFilter();
    }
  </script>
</body>
</html>
