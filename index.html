<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arked Lestari Cafe Finder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .header { background: #1f2937; color: white; padding: 30px; text-align: center; border-radius: 8px; margin-bottom: 30px; }
    .header h1 { font-size: 32px; margin-bottom: 10px; }
    .cafe { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; border-left: 4px solid #007bff; }
    .cafe h2 { font-size: 22px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .status-open { background: #28a745; color: white; padding: 4px 12px; border-radius: 4px; font-size: 12px; }
    .status-closed { background: #dc3545; color: white; padding: 4px 12px; border-radius: 4px; font-size: 12px; }
    .info { margin: 10px 0; font-size: 14px; color: #666; }
    .special { background: #fff3cd; padding: 12px; margin-top: 12px; border-radius: 4px; border-left: 4px solid #ffc107; }
    .special-title { font-weight: bold; color: #856404; display: block; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>☕ Arked Lestari Cafes</h1>
    <p>Click Admin Link to Update</p>
    <p><a href="admin.html" style="color: #ffc107; text-decoration: none;">→ Admin Panel</a></p>
  </div>

  <div id="cafes"></div>

  <script>
    const CAFES = ['Cafe EastCoast', 'Cafe Lanita', 'Cafe Navy Blue', 'Cafe Western', 'Cafe Ajimory'];

    function render() {
      const data = JSON.parse(localStorage.getItem('cafeData') || '{}');
      let html = '';

      CAFES.forEach(cafe => {
        const info = data[cafe] || { status: 'open', hours: '7:00 AM - 10:00 PM', location: '', special: '' };
        const statusClass = info.status === 'open' ? 'status-open' : 'status-closed';
        const statusText = info.status === 'open' ? 'OPEN' : 'CLOSED';

        html += `
          <div class="cafe">
            <h2>${cafe} <span class="${statusClass}">${statusText}</span></h2>
            <div class="info">⏰ ${info.hours}</div>
            <div class="info">📍 ${info.location || '(not set)'}</div>
            ${info.special ? `<div class="special"><span class="special-title">TODAY'S SPECIAL:</span>${info.special}</div>` : ''}
          </div>
        `;
      });

      document.getElementById('cafes').innerHTML = html;
    }

    // Update every 500ms
    setInterval(render, 500);
    render();
  </script>
</body>
</html>
